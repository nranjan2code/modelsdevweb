name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Style gate (brand tokens)
        run: pnpm check:style

      - name: Docs gate (specs match source)
        run: pnpm check:docs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Sync model catalog and price archive
        run: pnpm sync

      - name: Fetch daily model news
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: pnpm news

      - name: Discover and verify first-party free offers
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: pnpm offers

      - name: Sync open-weight licence facts (Hugging Face, daily)
        run: pnpm sync-weights

      - name: Sync external signals (Hugging Face and GitHub, every 6h)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync-external

      - name: Sync ecosystem adoption (GitHub and npm, daily)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync-ecosystem

      - name: Data quality gates (with external signals)
        run: pnpm gate

      - name: Notify watchers
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
        run: pnpm notify

      - name: Commit snapshots, archive, weights, events and signals
        run: |
          git config user.name "model-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots events news offers
          if git diff --cached --quiet; then
            echo "No data changes detected"
          else
            git commit -m "sync: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
