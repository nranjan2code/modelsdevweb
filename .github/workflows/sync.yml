name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Style gate (brand tokens)
        run: pnpm check:style

      - name: Lint
        run: pnpm lint

      - run: pnpm test

      - run: pnpm sync

      - name: Data quality gates
        run: pnpm gate

      - name: Fetch daily model news
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: pnpm news

      - name: Sync external signals (HF, GitHub, PWC, LMSYS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync-external

      - name: Data quality gates (with external signals)
        run: pnpm gate

      - name: Notify watchers
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
        run: pnpm notify

      - name: Commit snapshots, events, and external signals
        run: |
          git config user.name "model-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots events news
          if git diff --cached --quiet; then
            echo "No data changes detected"
          else
            git commit -m "sync: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
